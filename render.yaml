services:
  - type: web
    name: rentapp-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DB_ENGINE
        value: "postgresql"
      - key: DB_NAME
        fromDatabase:
          name: rentapp-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: rentapp-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: rentapp-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: rentapp-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: rentapp-db
          property: port
      - key: ALLOWED_HOSTS
        value: "rentapp-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://rentapp-frontend.vercel.app"
      - key: SECURE_SSL_REDIRECT
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.0"

databases:
  - name: rentapp-db
    databaseName: rentapp
    user: rentapp
